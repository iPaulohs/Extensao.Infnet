version: "3.8"

networks:
  platform-net:
    driver: bridge

volumes:
  rabbitmq_data:
  postgres_data:
  neo4j_data:
  minio_data:
  redis_data:

services:
  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"    # Porta AMQP
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: UWJhrL3d1MTgAMSq0zQfF7
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - platform-net

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: m7Tu2lwq4a7asdht93ARpa
      POSTGRES_DB: geekhub_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - platform-net

  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"  # Neo4j Browser (HTTP)
      - "7687:7687"  # Protocolo Bolt
    environment:
      NEO4J_AUTH: neo4j/mV7T3Qta7SiYcqARStZpnu
    volumes:
      - neo4j_data:/data
    networks:
      - platform-net

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Console Web
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: Ft8SV44uQN9dvL7I5nN7Ln
    volumes:
      - minio_data:/data
    networks:
      - platform-net

  redis:
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass "nw5DUE14cKgPldcpdqJ5c9"
    networks:
      - platform-net

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    restart: unless-stopped
    ports:
      - "5540:5540"
    networks:
      - platform-net